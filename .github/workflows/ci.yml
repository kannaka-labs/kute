name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  rustbpe-backend:
    name: rustbpe reference backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rustbpe
          workspaces: backends/rustbpe
      - name: Test the rustbpe backend
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):$LD_LIBRARY_PATH"
          cd backends/rustbpe && cargo test --locked

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - name: Build and test
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest tiktoken
          maturin develop --release
          pytest tests -q

  conformance:
    name: independent digest implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recorded vectors
        run: python conformance/kvf_digest.py specifications/kvf/vectors/*.kvf specifications/kvf/vectors/v0.2.0/*.kvf
      - name: Freshly trained and evolved vocabularies
        run: |
          cargo build --release -p kute-cli --locked
          K=target/release/kute
          $K sample-data --output data > /dev/null
          $K train --input data/words-train.txt --id ci:text --vocab-size 2000 --description 'quote " backslash \ tab	 é 日本' --output text.kvf > /dev/null
          $K train --input data/frames-train.bin --id ci:binary --adapter binary --vocab-size 600 --output binary.kvf > /dev/null
          $K train --input data/messages-train.jsonl --id ci:json --adapter jsonl --vocab-size 800 --output json.kvf > /dev/null
          $K train --input data/alarms-train.jsonl --id ci:events --algorithm sequence-bpe --adapter jsonl-events --adapter-option field=tag --vocab-size 64 --output events.kvf > /dev/null
          $K evolve --vocab events.kvf --add "NEW_EVENT" --add "NEW_EVENT OPERATOR_ACK" --new-version 0.2.0 --output evolved.kvf > /dev/null
          python conformance/kvf_digest.py text.kvf binary.kvf json.kvf events.kvf evolved.kvf

  benchmark-smoke:
    name: benchmark suite runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Run the suite once
        run: cargo run --release -p kute-cli -- benchmark --suite --repo-root . --iterations 1 --output suite.json > /dev/null
      - name: Every case must reconstruct exactly
        run: |
          python - <<'EOF'
          import json
          report = json.load(open("suite.json"))
          assert report["cases"], "no cases ran"
          for case in report["cases"]:
              assert case["trained"]["round_trip_canonical_exact"], case["id"]
              assert case["baseline"]["round_trip_canonical_exact"], case["id"]
          print(len(report["cases"]), "cases, all exact")
          EOF

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM: the one other processor family the
        # recorded representation similarities are checked on.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        # Every test binary runs even after one fails: a failure in one
        # must not hide whether the others pass on this system.
        run: cargo test --workspace --locked --no-fail-fast

  without-zstd:
    name: event and signal containers without Zstandard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: The two libraries are Rust only without the feature
        run: |
          ! cargo tree -p kute-events --no-default-features --locked -e normal,build --prefix none | grep -E '^(cc|zstd)'
          ! cargo tree -p kute-signals --no-default-features --locked -e normal,build --prefix none | grep -E '^(cc|zstd)'
      - name: Clippy
        run: cargo clippy -p kute-events -p kute-signals -p kute-cli --no-default-features --all-targets --locked
      - name: Test
        run: cargo test -p kute-events -p kute-signals -p kute-cli --no-default-features --locked --no-fail-fast

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  studio-browser:
    name: Studio in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Drive the page in headless Chrome
        # The runner's Chrome cannot start its sandbox; the page's own
        # policy, which is what the test checks, does not depend on it.
        env:
          KUTE_STUDIO_BROWSER: require
          KUTE_STUDIO_BROWSER_NO_SANDBOX: "1"
        run: cargo test -p kute-cli --test studio_browser --locked -- --nocapture

  rustbpe-backend:
    name: rustbpe reference backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rustbpe
          workspaces: backends/rustbpe
      - name: Test the rustbpe backend
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):$LD_LIBRARY_PATH"
          cd backends/rustbpe && cargo test --locked

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - name: Build and test
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest tiktoken
          maturin develop --release
          pytest tests -q

  conformance:
    name: independent digest implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recorded vectors
        run: python conformance/kvf_digest.py specifications/kvf/vectors/*.kvf specifications/kvf/vectors/v0.2.0/*.kvf
      - name: Freshly trained and evolved vocabularies
        run: |
          cargo build --release -p kute-cli --locked
          K=target/release/kute
          $K sample-data --output data > /dev/null
          $K train --input data/words-train.txt --id ci:text --vocab-size 2000 --description 'quote " backslash \ tab	 é 日本' --output text.kvf > /dev/null
          $K train --input data/frames-train.bin --id ci:binary --adapter binary --vocab-size 600 --output binary.kvf > /dev/null
          $K train --input data/messages-train.jsonl --id ci:json --adapter jsonl --vocab-size 800 --output json.kvf > /dev/null
          $K train --input data/alarms-train.jsonl --id ci:events --algorithm sequence-bpe --adapter jsonl-events --adapter-option field=tag --vocab-size 64 --output events.kvf > /dev/null
          $K evolve --vocab events.kvf --add "NEW_EVENT" --add "NEW_EVENT OPERATOR_ACK" --new-version 0.2.0 --output evolved.kvf > /dev/null
          python conformance/kvf_digest.py text.kvf binary.kvf json.kvf events.kvf evolved.kvf

  benchmark-smoke:
    name: benchmark suite runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Run the suite once
        run: cargo run --release -p kute-cli -- benchmark --suite --repo-root . --iterations 1 --output suite.json > /dev/null
      - name: Every case must reconstruct exactly
        run: |
          python - <<'EOF'
          import json
          report = json.load(open("suite.json"))
          assert report["cases"], "no cases ran"
          for case in report["cases"]:
              assert case["trained"]["round_trip_canonical_exact"], case["id"]
              assert case["baseline"]["round_trip_canonical_exact"], case["id"]
          print(len(report["cases"]), "cases, all exact")
          EOF

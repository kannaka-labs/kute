[package]
name = "kute-cli"
description = "Command line interface for the Kannaka Universal Tokenization Engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "kute"
path = "src/main.rs"

[dependencies]
kute.workspace = true
kute-bench.workspace = true
kute-discover.workspace = true
kute-events.workspace = true
kute-signals.workspace = true
kute-protocol.workspace = true
base64.workspace = true
ring = "0.17"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["zstd"]
# Zstandard in the event and signal containers. Without it those
# commands write zlib and refuse Zstandard containers.
zstd = ["kute-events/zstd", "kute-signals/zstd"]

[dev-dependencies]
serde_json.workspace = true
rcgen = "0.13"

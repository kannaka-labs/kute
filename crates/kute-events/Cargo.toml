[package]
name = "kute-events"
description = "Complete event records for KUTE: entity, time and attributes kept exactly, stored by column"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
kute-types.workspace = true
kute-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
zstd = { workspace = true, optional = true }

[features]
default = ["zstd"]
# Zstandard columns: smaller containers, and a C compiler to build.
# Without it the crate is Rust only, writes zlib columns, and refuses a
# container whose columns are Zstandard.
zstd = ["dep:zstd"]

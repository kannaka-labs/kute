[workspace]
resolver = "2"
members = ["crates/*", "plugins/hrm"]
# The Python bindings link against an interpreter; they build with maturin and
# stay out of the default workspace so `cargo test --workspace` needs no Python.
exclude = ["bindings/python", "backends/rustbpe"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Kannaka Labs"]
repository = "https://github.com/kannaka-labs/kute"
homepage = "https://github.com/kannaka-labs/kute"
keywords = ["tokenizer", "bpe", "tokenization", "vocabulary"]
categories = ["text-processing", "encoding"]

[workspace.dependencies]
kute-types = { path = "crates/kute-types", version = "0.5.0" }
kute-core = { path = "crates/kute-core", version = "0.5.0" }
kute-vocab = { path = "crates/kute-vocab", version = "0.5.0" }
kute-bpe = { path = "crates/kute-bpe", version = "0.5.0" }
kute-algorithms = { path = "crates/kute-algorithms", version = "0.5.0" }
kute-adapters = { path = "crates/kute-adapters", version = "0.5.0" }
kute-bench = { path = "crates/kute-bench", version = "0.5.0" }
kute-hrm = { path = "plugins/hrm", version = "0.5.0" }
kute-discover = { path = "crates/kute-discover", version = "0.5.0" }
kute-protocol = { path = "crates/kute-protocol", version = "0.5.0" }
kute = { package = "kute-engine", path = "crates/kute", version = "0.5.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"
semver = { version = "1", features = ["serde"] }
fancy-regex = "0.16"
regex = "1"
rayon = "1.10"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
flate2 = "1"

# Tests train real vocabularies; a little optimization keeps the suite quick.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4

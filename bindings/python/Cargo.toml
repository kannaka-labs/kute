[package]
name = "kute-python"
description = "Python bindings for the Kannaka Universal Tokenization Engine"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["Kannaka Labs"]
publish = false

# Built with maturin, outside the main workspace (it links a Python interpreter).
[workspace]

[lib]
name = "kute_python"
crate-type = ["cdylib"]

[dependencies]
kute = { package = "kute-engine", path = "../../crates/kute" }
kute-bench = { path = "../../crates/kute-bench" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
